name: Generate website preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - workout-data.js
      - .github/workflows/preview.yml
permissions:
  contents: write
concurrency:
  group: screenshot-preview
  cancel-in-progress: false
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture real website
        run: |
          mkdir -p assets
          python3 -m http.server 8765 >/tmp/workout-server.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({viewport:{width:1200,height:630},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
            await page.locator('.section').first().waitFor();
            await page.locator('.body-map').first().waitFor();
            await page.locator('.radar').first().waitFor();
            await page.evaluate(async () => {
              await Promise.all([...document.images].map(img =>
                img.decode().catch(() => {})));
            });
            await page.screenshot({path:'assets/social-preview.png',animations:'disabled'});
            await page.setViewportSize({width:1200,height:900});
            await page.screenshot({path:'assets/screenshot.png',fullPage:true,animations:'disabled'});
            await browser.close();
          })().catch(error => {console.error(error);process.exit(1)});
          NODE
      - name: Commit preview assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot.png assets/social-preview.png
          if git diff --cached --quiet; then
            echo "Preview already up to date"
          else
            git commit -m "Update website preview screenshots"
            git pull --rebase origin main
            git push origin main
          fi

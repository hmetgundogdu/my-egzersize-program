name: Generate PWA icons
on:
  push:
    branches: [main]
    paths:
      - assets/app-icon.svg
      - .github/workflows/pwa-icons.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pwa-icons
  cancel-in-progress: false
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install icon renderer
        run: python3 -m pip install --user cairosvg pillow
      - name: Render install icons
        run: |
          python3 - <<'PY'
          import cairosvg
          for size in [180,192,512]:
              out='assets/apple-touch-icon.png' if size==180 else f'assets/icon-{size}.png'
              cairosvg.svg2png(url='assets/app-icon.svg',write_to=out,output_width=size,output_height=size)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Render PWA install icons"
            git pull --rebase origin main
            git push origin main
          fi
